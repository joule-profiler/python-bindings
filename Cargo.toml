[package]
name = "joule-profiler-python"
version = "0.0.1"
description = "Python bindings for joule-profiler"
edition = "2024"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.2"
joule-profiler-config = { git = "https://github.com/joule-profiler/joule-profiler.git", branch = "refactor/v4-arch", features = ["json", "toml"] }
joule-profiler-injector-stdout = { git = "https://github.com/joule-profiler/joule-profiler.git", branch = "refactor/v4-arch" }
joule-profiler-core = { git = "https://github.com/joule-profiler/joule-profiler.git", branch = "refactor/v4-arch" }
serde = "1.0.229"
serde_json = "1.0.151"
log = { version = "0.4.34", features = ["release_max_level_off"]}
thiserror = "2.0.21"
libc = "0.2.190"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
struct_field_names = "allow"
